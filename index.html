<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171B34;
    --panel: #232951;
    --panel-edge: #323a6e;
    --cream: #F3EFE4;
    --amber: #F2A65A;
    --amber-dim: #c9814a;
    --dim: #9098c4;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--cream);
    display:flex;
    justify-content:center;
    overscroll-behavior: none;
  }
  #app{
    width:100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    display:flex;
    flex-direction:column;
    background: radial-gradient(circle at 50% -10%, #262d59 0%, var(--bg) 55%);
  }

  /* ---------- Head stage ---------- */
  #stage{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 8px 20px 4px;
    border-bottom: 1px solid var(--panel-edge);
    position: relative;
  }
  #stage::before{
    content:"";
    position:absolute;
    top: -4px;
    width: 340px;
    height: 340px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(242,166,90,0.18) 0%, rgba(242,166,90,0) 70%);
    pointer-events:none;
  }

  #head-wrap{ width: 260px; height: 260px; max-width: 68vw; max-height: 68vw; position:relative; z-index:1; }
  #head-wrap svg{ width:100%; height:100%; overflow: visible; }

  .antenna-line{ transform-box: fill-box; transform-origin: center bottom; animation: sway 3.6s ease-in-out infinite; }
  @keyframes sway{
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
  }
  .antenna-tip{ animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  #eye-l, #eye-r{
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.5s ease-in-out infinite;
  }
  #eye-r{ animation-delay: 0.06s; }
  @keyframes blink{
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }

  #mouth{ }

  .ear-wave{ opacity: 0; transition: opacity 0.2s ease; }
  #head-wrap.talking .ear-wave{ opacity: 1; animation: wave-pulse 0.9s ease-in-out infinite; }
  .ear-wave.outer{ animation-delay: 0.15s; }
  @keyframes wave-pulse{
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  #head-wrap.talking #eye-l, #head-wrap.talking #eye-r{ animation-duration: 2.6s; }
  #head-wrap.thinking .antenna-line{ animation-duration: 0.7s; }
  #head-wrap.thinking .seam{ animation: seam-scan 1s linear infinite; }
  @keyframes seam-scan{
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  #name-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: 2px;
  }
  #name-row .title{
    font-family: var(--font-display);
    font-size: 19px;
    font-weight:600;
  }
  #status-dot{
    width:8px; height:8px; border-radius:50%;
    background: #6de08a;
    box-shadow: 0 0 0 0 rgba(109,224,138,0.6);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(109,224,138,0.5); }
    70%{ box-shadow: 0 0 0 7px rgba(109,224,138,0); }
    100%{ box-shadow: 0 0 0 0 rgba(109,224,138,0); }
  }
  .subtitle{ font-size: 12.5px; color: var(--dim); margin-top: 3px; }

  #voiceSelect{
    margin-top: 8px;
    max-width: 220px;
    background: var(--panel);
    color: var(--cream);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    font-size: 12px;
    padding: 4px 8px;
    font-family: var(--font-body);
  }

  #langSelect{
    margin-top: 6px;
    max-width: 220px;
    background: var(--panel);
    color: var(--cream);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    font-size: 12px;
    padding: 4px 8px;
    font-family: var(--font-body);
  }

  #pickers{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; justify-content:center; }
  #pickers select{
    margin-top:0; max-width:150px;
    background: var(--panel); color: var(--cream);
    border: 1px solid var(--panel-edge); border-radius: 12px;
    font-size: 12px; padding: 4px 8px; font-family: var(--font-body);
  }

  #mute{
    position:absolute;
    top: 0; right: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #mute svg{ width:16px; height:16px; }
  #mute.off{ color: var(--dim); }

  /* ---------- Thread ---------- */
  #thread{
    flex:1;
    overflow-y:auto;
    padding: 16px 16px 10px;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  #thread::-webkit-scrollbar{ width:0; }

  .empty-state{
    margin: auto 8px;
    text-align:center;
    color: var(--dim);
    font-size: 13px;
    line-height:1.5;
    max-width: 280px;
    margin-left:auto; margin-right:auto;
  }

  .bubble-row{ display:flex; align-items:flex-end; gap:6px; }
  .bubble-row.user{ justify-content:flex-end; }
  .bubble-row.bot{ justify-content:flex-start; }

  .listen-btn{
    flex-shrink:0;
    width: 30px; height: 30px;
    border-radius:50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    font-size: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .listen-btn:active{ transform: scale(0.9); }

  .bubble{
    max-width: 76%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user{
    background: var(--amber);
    color: #241708;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    border-bottom-left-radius: 4px;
  }
  .bubble.error{
    background: #3a2130;
    border: 1px solid #6e3250;
    color: #f0c4d8;
  }

  .typing{ display:flex; gap:4px; padding: 14px 16px; align-items:center; }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--dim);
    animation: bounce 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100% { transform: translateY(0); opacity:0.5; }
    30% { transform: translateY(-4px); opacity:1; }
  }

  form#composer{
    flex-shrink:0;
    display:flex;
    gap: 8px;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--panel-edge);
    background: var(--bg);
  }
  #input{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    font-family: var(--font-body);
    font-size: 16px;
    border-radius: 20px;
    padding: 11px 16px;
    outline:none;
    max-height: 110px;
    line-height:1.4;
  }
  #input:focus{ border-color: var(--amber-dim); }
  #input::placeholder{ color: var(--dim); }

  #send{
    flex-shrink:0;
    width: 44px; height:44px;
    border-radius:50%;
    border:none;
    background: var(--amber);
    color:#241708;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  #send:active{ transform: scale(0.92); }
  #send:disabled{ opacity:0.4; cursor:default; }
  #send svg{ width:19px; height:19px; }

  #mic{
    flex-shrink:0;
    width: 44px; height:44px;
    border-radius:50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  #mic:active{ transform: scale(0.92); }
  #mic svg{ width:18px; height:18px; }
  #mic.listening{
    background: #d84c4c;
    border-color: #d84c4c;
    color: var(--cream);
    animation: mic-pulse 1.3s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(216,76,76,0.5); }
    50% { box-shadow: 0 0 0 9px rgba(216,76,76,0); }
  }
  #mic:disabled{ opacity:0.4; cursor:default; }

  #info-btn{
    position:absolute;
    top: 0; left: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--amber);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    font-style: italic;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #info-panel{
    display:none;
    position:fixed;
    top:0; bottom:0; left:50%;
    transform: translateX(-50%);
    width:100%; max-width:480px;
    z-index: 100;
    background: var(--bg);
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #info-panel.open{ display:flex; }
  .info-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--panel-edge);
  }
  .info-title{ font-family: var(--font-display); font-weight:700; font-size:18px; color: var(--cream); }
  .info-close{
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--panel-edge); background: var(--panel);
    color: var(--cream); font-size:15px; cursor:pointer;
  }
  .info-body{ flex:1; overflow-y:auto; padding: 8px 16px 24px; }
  .info-hint{ color: var(--dim); font-size:13px; margin: 6px 0 4px; }
  .info-sec{ margin-top: 18px; }
  .info-sec h3{ margin:0 0 6px; font-family: var(--font-display); font-size:16px; color: var(--amber); }
  .info-sec p{ margin:0 0 8px; font-size:13px; line-height:1.45; color: var(--dim); }
  .info-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .info-chip{
    border:1px solid var(--panel-edge); background: var(--panel);
    color: var(--cream); font-family: var(--font-body); font-size:13px;
    padding: 8px 12px; border-radius: 16px; cursor:pointer; text-align:left;
  }
  .info-chip:active{ background: var(--panel-edge); }
</style>
</head>
<body>

<audio id="ai-audio" playsinline style="display:none"></audio>

<div id="app">
  <div id="stage" style="position:relative;">
    <button id="info-btn" aria-label="Que sais-tu faire ?">i</button>
    <button id="mute" aria-label="Couper la voix">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="4 9 8 9 12 5 12 19 8 15 4 15 4 9" fill="currentColor" stroke="none"/>
        <path id="wave1" d="M15.5 9a5 5 0 0 1 0 6"/>
        <path id="wave2" d="M18 6.5a9 9 0 0 1 0 11"/>
      </svg>
    </button>

    <div id="head-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <g id="body-art"><path d="M 30 200 C 34 176, 68 166, 88 164 L 112 164 C 132 166, 166 176, 170 200 Z" fill="#323a6e"/>
        <path d="M 80 168 Q 100 182 120 168" stroke="#F2A65A" stroke-width="4" stroke-linecap="round" fill="none"/>
        <circle cx="100" cy="190" r="5" fill="#F2A65A" class="antenna-tip"/></g>
        <g id="head-art" transform="translate(100,104) scale(1.45)"></g>
      </svg>
    </div>

    <div id="name-row">
      <span class="title" id="botTitle">Bip bip</span>
      <div id="status-dot"></div>
    </div>
    <div class="subtitle">Pose-moi n'importe quelle question, à voix... écrite</div>
    <div id="pickers"><select id="voiceSelect" aria-label="Choisir une voix"></select><select id="headSelect" aria-label="Choisir une tête"></select><select id="hairSelect" aria-label="Choisir une coupe de cheveux" style="display:none"></select></div>
  </div>

  <div id="thread">
    <div class="empty-state" id="empty-state">
      Histoire, science, cuisine, code, conseils... écris ta question en bas, et je te réponds à voix haute.
    </div>
  </div>

  <form id="composer">
    <textarea id="input" placeholder="Écris ou parle..." rows="1"></textarea>
    <button type="button" id="mic" aria-label="Poser une question au micro">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <button type="submit" id="send" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('mic');
  const headWrap = document.getElementById('head-wrap');
  let mouth = null;
  let botName = 'Bip bip';
  let curClosed = null, curShapes = null;
  const muteBtn = document.getElementById('mute');
  const wave1 = document.getElementById('wave1');
  const wave2 = document.getElementById('wave2');
  const voiceSelect = document.getElementById('voiceSelect');

  let history = [];
  let muted = false;
  let mouthTimer = null;
  let selectedVoiceURI = localStorage.getItem('bipbip_voice') || '';

  const MOUTH_CLOSED = "M -12 14 Q 0 22 12 14 Z";
  const MOUTH_SHAPES = [
    "M -12 13 Q 0 38 12 13 Z",
    "M -11 14 Q 0 28 11 14 Z",
    "M -12 14 Q 0 22 12 14 Z",
    "M -12 13 Q 0 33 12 13 Z"
  ];

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.classList.toggle('off', muted);
    wave1.style.display = muted ? 'none' : '';
    wave2.style.display = muted ? 'none' : '';
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });

  function saveHistory() {
    try { localStorage.setItem('bipbip_history', JSON.stringify(history)); } catch (e) {}
  }

  function loadHistory() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem('bipbip_history') || '[]'); } catch (e) { saved = []; }
    if (!Array.isArray(saved) || !saved.length) return;
    history = saved;
    saved.forEach(item => {
      addBubble(item.role === 'user' ? 'user' : 'bot', item.content);
    });
  }

  function addImageBubble(role, caption, images) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');

    const captionEl = document.createElement('div');
    captionEl.textContent = caption;
    bubble.appendChild(captionEl);

    const grid = document.createElement('div');
    grid.style.display = 'flex';
    grid.style.flexWrap = 'wrap';
    grid.style.gap = '6px';
    grid.style.marginTop = '8px';
    images.forEach(img => {
      const imageEl = document.createElement('img');
      imageEl.src = img.thumbnail || img.url;
      imageEl.alt = img.title || caption;
      imageEl.style.width = '96px';
      imageEl.style.height = '96px';
      imageEl.style.objectFit = 'cover';
      imageEl.style.borderRadius = '10px';
      grid.appendChild(imageEl);
    });
    bubble.appendChild(grid);
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addBubble(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
    bubble.textContent = text;
    row.appendChild(bubble);

    if (role !== 'user') {
      const listenBtn = document.createElement('button');
      listenBtn.type = 'button';
      listenBtn.className = 'listen-btn';
      listenBtn.setAttribute('aria-label', 'Écouter cette réponse');
      listenBtn.innerHTML = '🔊';
      listenBtn.addEventListener('click', () => speak(text));
      row.appendChild(listenBtn);
    }

    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    row.id = 'typing-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    headWrap.classList.add('thinking');
  }

  function removeTyping() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
    headWrap.classList.remove('thinking');
  }

  function startTalking() {
    headWrap.classList.add('talking');
    let i = 0;
    mouthTimer = setInterval(() => {
      mouth.setAttribute('d', curShapes[i % curShapes.length]);
      i++;
    }, 130);
  }

  function stopTalking() {
    headWrap.classList.remove('talking');
    clearInterval(mouthTimer);
    mouth.setAttribute('d', curClosed);
  }

  function getVoicesAsync() {
    return new Promise((resolve) => {
      const existing = window.speechSynthesis.getVoices();
      if (existing.length) { resolve(existing); return; }
      window.speechSynthesis.onvoiceschanged = () => {
        resolve(window.speechSynthesis.getVoices());
      };
      // Filet de sécurité si l'événement ne se déclenche jamais
      setTimeout(() => resolve(window.speechSynthesis.getVoices()), 500);
    });
  }

  function pickBestFrenchVoice(voices) {
    const frVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if (!frVoices.length) return null;
    // On préfère les voix "haute qualité" connues (Google, Natural, Enhanced, Premium)
    // avant les voix système basiques.
    const qualityHints = ['google', 'natural', 'enhanced', 'premium', 'neural'];
    const scored = frVoices.map(v => {
      const name = v.name.toLowerCase();
      const score = qualityHints.reduce((acc, hint) => acc + (name.includes(hint) ? 10 : 0), 0)
        + (v.localService ? 1 : 0);
      return { v, score };
    });
    scored.sort((a, b) => b.score - a.score);
    return scored[0].v;
  }

  let cachedFrVoice = null;
  let allFrVoices = [];
  getVoicesAsync().then(voices => {
    cachedFrVoice = pickBestFrenchVoice(voices);
    allFrVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    voiceSelect.innerHTML = '';
    const autoOpt = document.createElement('option');
    autoOpt.value = '';
    autoOpt.textContent = 'Voix automatique';
    voiceSelect.appendChild(autoOpt);
    allFrVoices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = v.name;
      voiceSelect.appendChild(opt);
    });
    voiceSelect.value = selectedVoiceURI;
  });

  voiceSelect.addEventListener('change', () => {
    selectedVoiceURI = voiceSelect.value;
    localStorage.setItem('bipbip_voice', selectedVoiceURI);
  });

  // ---------- Coupes de cheveux ----------
  const HL = '<path d="M 70 34 Q 96 22 124 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.18"/>';
  const F = 'fill="url(#hairFill)"';
  const FRONT_LONG = '<path d="M 50 102 C 40 48, 74 20, 102 22 C 136 22, 162 52, 150 102 C 148 76, 136 58, 114 48 C 106 62, 84 78, 62 84 C 56 88, 52 94, 50 102 Z" ' + F + '/>' + HL;
  const FRONT_SHORT = '<path d="M 54 92 C 48 50, 76 24, 102 24 C 130 24, 152 50, 146 92 C 142 70, 130 56, 110 50 C 100 62, 80 72, 62 78 C 58 82, 55 86, 54 92 Z" ' + F + '/>' + HL;
  const CAP = '<path d="M 48 98 C 40 44, 72 14, 100 14 C 128 14, 160 44, 152 98 L 148 80 L 52 80 Z" ' + F + '/>';
  const HAIRS = {
    longs: { label: 'Longs', back: '<path d="M 38 100 C 28 40, 70 12, 100 12 C 130 12, 172 40, 162 100 C 170 150, 178 182, 158 200 L 42 200 C 22 182, 30 150, 38 100 Z" ' + F + '/>', front: FRONT_LONG },
    carre: { label: 'Carré', back: '<path d="M 40 100 C 30 40, 70 12, 100 12 C 130 12, 170 40, 160 100 C 164 124, 162 140, 152 148 L 48 148 C 38 140, 36 124, 40 100 Z" ' + F + '/>', front: FRONT_LONG },
    court: { label: 'Court', back: CAP, front: FRONT_SHORT },

  // Convertit l'audio brut (PCM) renvoyé par Gemini en fichier WAV lisible par le navigateur
  function pcmToWavBlob(base64Data, mimeType) {
    const rateMatch = /rate=(\d+)/.exec(mimeType || '');
    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
    const binary = atob(base64Data);
    const len = binary.length;
    const buffer = new ArrayBuffer(44 + len);
    const view = new DataView(buffer);
    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }
    writeString(0, 'RIFF');
    view.setUint32(4, 36 + len, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, len, true);
    for (let i = 0; i < len; i++) view.setUint8(44 + i, binary.charCodeAt(i));
    return new Blob([buffer], { type: 'audio/wav' });
  }

  async function speak(text) {
    if (muted) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    aiAudioEl.pause();

    if (selectedVoiceURI) {
      speakBrowser(text);
      return;
    }

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: "tts", text }),
      });
      if (!res.ok) throw new Error('tts http ' + res.status);
      const data = await res.json();
      if (!data.audioBase64) throw new Error('pas audio');

      const blob = pcmToWavBlob(data.audioBase64, data.mimeType);
      const url = URL.createObjectURL(blob);
      aiAudioEl.onplay = startTalking;
      aiAudioEl.onended = () => { stopTalking(); URL.revokeObjectURL(url); };
      aiAudioEl.onerror = () => { stopTalking(); URL.revokeObjectURL(url); };
      aiAudioEl.src = url;
      await aiAudioEl.play();
    } catch (err) {
      // Repli silencieux sur la voix simple du navigateur si la voix IA échoue
      speakBrowser(text);
    }
  }

  function weatherCodeToText(code) {
    const map = {

      45: "brouillard", 48: "brouillard givrant",

  function getCoords() {
    return new Promise((resolve) => {
      if (cachedCoords) { resolve(cachedCoords); return; }
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          cachedCoords = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
          resolve(cachedCoords);
        },
        () => resolve(null),
        { timeout: 8000 }
      );
    });
  }

  const CURRENCY_WORDS = {
    'euro': 'EUR', 'euros': 'EUR',
    'dollar canadien': 'CAD', 'dollars canadiens': 'CAD',
    'dollar': 'USD', 'dollars': 'USD',

  async function fetchCurrencyContext(question) {
    const lower = question.toLowerCase();
    const isConversion = /taux de change|combien (vaut|font|coûte)|conversion|convertir/.test(lower);
    if (!isConversion) return '';
    const found = new Set();
    for (const word in CURRENCY_WORDS) {
      if (lower.includes(word)) found.add(CURRENCY_WORDS[word]);
    }
    if (found.size === 0) return '';
    const codes = Array.from(found);
    const base = codes[0];
    const targets = codes.slice(1).length ? codes.slice(1) : ['EUR', 'USD', 'GBP', 'CHF'].filter(c => c !== base);
    try {
      const res = await fetch(`https://api.frankfurter.app/latest?from=${base}&to=${targets.join(',')}`);
      const data = await res.json();
      const rates = Object.entries(data.rates).map(([c, r]) => `1 ${base} = ${r} ${c}`).join(', ');
      return "Taux de change actuels : " + rates + ".";
    } catch (e) { return ''; }
  }

    try {

      const sumRes = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);

  // ---------- Calculatrice vocale ----------
  function tryHandleCalculation(text) {
    const lower = text.toLowerCase().trim();
    const triggerMatch = lower.match(/^(?:calcule|calcul|combien (?:fait|font|vaut)|c'est combien)\s*:?\s*(.+)/);
    if (!triggerMatch) return false;

    let expr = triggerMatch[1];
    expr = expr
      .replace(/plus/g, '+')
      .replace(/moins/g, '-')
      .replace(/fois|multiplié par/g, '*')
      .replace(/divisé par/g, '/')
      .replace(/,/g, '.')
      .replace(/\?/g, '');

    if (!/^[0-9+\-*/().\s]+$/.test(expr)) {
      const msg = "Je n'ai pas compris ce calcul.";
      addBubble('bot', msg);
      history.push({ role: 'assistant', content: msg });
      saveHistory();
      speak(msg);
      return true;
    }

    let result;
    try {
      result = Function('"use strict"; return (' + expr + ')')();
    } catch (e) {
      result = null;
    }

    const msg = (result === null || result === undefined || Number.isNaN(result) || !Number.isFinite(result))
      ? "Je n'ai pas réussi à calculer ça."
      : 'Ça fait ' + result + '.';
    addBubble('bot', msg);
    history.push({ role: 'assistant', content: msg });
    saveHistory();
    speak(msg);
    return true;
  }

  const TIME_ZONES = {
    'paris': ['Europe/Paris', 'à Paris'], 'tokyo': ['Asia/Tokyo', 'à Tokyo'],

    'beyrouth': ['Asia/Beirut', 'à Beyrouth']
  };
  function tryHandleTime(text) {
    const t = norm(text).replace(/[?!.]+$/, '').trim();
    if (/^(quel jour (sommes[- ]nous|est[- ]on|on est)|quelle est la date|on est quel jour|quelle date (sommes[- ]nous|est[- ]on|on est))/.test(t)) {
      const d = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return botReply('Nous sommes le ' + d + '.');
    }
    if (!/^(quelle heure|il est quelle heure|donne[- ]moi l'heure|dis[- ]moi l'heure|l'heure)/.test(t)) return false;
    const city = Object.keys(TIME_ZONES).sort((a, b) => b.length - a.length).find(n => t.includes(n));
    const rest = t.replace(/^(quelle heure est[- ]il|quelle heure|il est quelle heure|donne[- ]moi l'heure|dis[- ]moi l'heure|l'heure)/, '');
    if (!city && /(?:^|\s)(?:a|au|en)\s+\S+/.test(rest) && !/maintenant|ce moment/.test(rest)) {
      return botReply("Je ne connais pas cette ville. Essaie une grande ville, comme Tokyo ou New York.");
    }
    const opts = { hour: 'numeric', minute: '2-digit', hourCycle: 'h23' };
    if (city) opts.timeZone = TIME_ZONES[city][0];
    const [h, m] = new Intl.DateTimeFormat('fr-FR', opts).format(new Date()).split(':');
    const hh = parseInt(h, 10);
    const timeStr = hh + ' h' + (m === '00' ? '' : ' ' + m);
    return botReply('Il est ' + timeStr + (city ? ' ' + TIME_ZONES[city][1] : '') + '.');
  }

  function seededRng(str) {
    let h = 2166136261;

      let t = a;

  function easterDate(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  }

  function tryHandleHolidays(text) {
    const t = norm(text).replace(/[?!.]+$/, '');
    const today = new Date();
    const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const y = midnight.getFullYear();
    if (/(jours? feries|prochain(?:s)? (?:jour|conge)s?)/.test(t) && t.length < 60) {
      const upcoming = holidaysFor(y).concat(holidaysFor(y + 1)).filter(h => h.ferie && h.d >= midnight).slice(0, 5);
      const lines = upcoming.map(h => h.label + ' : ' + h.d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
      return botReply('Les prochains jours fériés :\n' + lines.join('\n'), 'Les prochains jours fériés sont : ' + lines.join(', ') + '.');
    }
    if (!/(quand (?:est|a lieu|tombe|c'est)|c'est quand|combien de jours|dans combien de temps|combien de temps (?:avant|jusqu))/.test(t)) return false;
    const pairs = [];
    holidaysFor(y).forEach(h => h.al.forEach(a => pairs.push([a, h.label])));
    pairs.sort((a, b) => b[0].length - a[0].length);
    const found = pairs.find(p => t.includes(p[0]));
    if (!found) return false;
    let ev = holidaysFor(y).find(h => h.label === found[1]);
    if (ev.d < midnight) ev = holidaysFor(y + 1).find(h => h.label === found[1]);

  async function trFr(s) {

      const d = await r.json();

      if ((cur + ' ' + p).length > max && cur) { chunks.push(cur.trim()); cur = p; }
      else cur += ' ' + p;
    });
    if (cur.trim()) chunks.push(cur.trim());
    return chunks;
  }

  const WIKT_CACHE = {};
  async function getWiktFrench(word) {

        const j = fr.search(/\n==\s*\{\{langue\|(?!fr\})/);

  function extractDefinitions(fr) {

      const itemRe = /\[\[([^\]|#]+)(?:\|[^\]]*)?\]\]|\{\{(?:lien|l)\|([^|}]+)/g;
      let it;
      while ((it = itemRe.exec(rest)) !== null) {
        const w = (it[1] || it[2]).trim();
        if (w && !out.includes(w)) out.push(w);
      }

    return out.slice(0, 10);
  }

      const local = findCapital(name);

      if (!res.ok) { removeTyping(); return botReply("Je ne trouve pas ce pays."); }
      const list = await res.json();
      removeTyping();
      const target = norm(name);
      const c = list.find(x => norm((x.translations && x.translations.fra && x.translations.fra.common) || '') === target || norm(x.name.common) === target) || list[0];
      const fra = (c.translations && c.translations.fra && c.translations.fra.common) || c.name.common;
      const artMap = { 'en ': 'de ', 'au ': 'du ', 'aux ': 'des ' };
      let deArt = artMap[art0] || art0;
      if (deArt === 'de ' && /^[aeiouyhâêîôûéèàÉÈÀ]/i.test(fra)) deArt = "d'";
      const de = deArt + fra;

      if (kind === 'capitale') {

    } catch (e) {

  // ----- Éphéméride -----
  async function tryHandleEphemeris(text) {
    const t = norm(text).replace(/[?!.]+$/, '');
    if (t.length > 80) return false;
    if (!/ephemeride|que s'est[- ]il passe|il s'est passe quoi|que s'est[- ]il produit|evenements? (du|de ce) jour/.test(t)) return false;
    const dm = t.match(new RegExp('\\b(1er|\\d{1,2})\\s+(' + FR_MONTHS_RE + ')\\b'));
    let day, month;
    if (dm) {
      day = dm[1] === '1er' ? 1 : parseInt(dm[1], 10);
      month = FR_MONTHS.indexOf(dm[2]) + 1;
    } else if (/ephemeride|aujourd'hui|ce jour|aujourdhui/.test(t)) {
      const now = new Date();
      day = now.getDate();
      month = now.getMonth() + 1;
    } else {
      return false;
    }
    if (day < 1 || day > 31) return false;
    addTyping();
    try {
      const mm = String(month).padStart(2, '0'), dd = String(day).padStart(2, '0');
      const res = await fetch('https://fr.wikipedia.org/api/rest_v1/feed/onthisday/events/' + mm + '/' + dd);
      const data = await res.json();
      removeTyping();
      const events = (data.events || []).filter(e => e.text && e.year);
      if (!events.length) return botReply("Je n'ai pas trouvé d'événement pour cette date.");
      const chosen = events.slice().sort(() => Math.random() - 0.5).slice(0, 3).sort((a, b) => a.year - b.year);
      const title = (day === 1 ? '1er' : day) + ' ' + FR_MONTHS_LABEL(month);
      const lines = chosen.map(e => e.year + ' : ' + e.text);
      return botReply('Le ' + title + ' :\n' + lines.join('\n'), 'Le ' + title + '. ' + lines.join('. '));
    } catch (e) {
      removeTyping();
      addBubble('bot', "Je n'ai pas réussi à me connecter à l'encyclopédie.").classList.add('error');
      return true;
    }
  }
  function FR_MONTHS_LABEL(m) {

  // ----- Soleil et lune -----
  function sunTimes(date, lat, lon) {
    const rad = Math.PI / 180;
    const y = date.getFullYear(), mo = date.getMonth(), da = date.getDate();
    const base = Date.UTC(y, mo, da);
    const doy = Math.round((base - Date.UTC(y, 0, 0)) / 86400000);
    const g = 2 * Math.PI / 365 * (doy - 1);
    const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    const cosHa = Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl);
    if (cosHa > 1) return { polar: 'night' };
    if (cosHa < -1) return { polar: 'day' };
    const ha = Math.acos(cosHa) / rad;
    return {
      rise: new Date(base + (720 - 4 * (lon + ha) - eq) * 60000),
      set: new Date(base + (720 - 4 * (lon - ha) - eq) * 60000)
    };
  }
  function moonInfo(date) {
    const syn = 29.530588853;
    const ref = Date.UTC(2000, 0, 6, 18, 14);
    let age = ((date.getTime() - ref) / 86400000) % syn;
    if (age < 0) age += syn;
    const illum = Math.round((1 - Math.cos(2 * Math.PI * age / syn)) / 2 * 100);
    const phases = [[1.85, 'nouvelle lune'], [5.54, 'premier croissant'], [9.22, 'premier quartier'], [12.91, 'lune gibbeuse croissante'], [16.61, 'pleine lune'], [20.3, 'lune gibbeuse décroissante'], [23.99, 'dernier quartier'], [27.68, 'dernier croissant'], [99, 'nouvelle lune']];
    const phase = phases.find(p => age < p[0])[1];
    const toFull = Math.round(((syn / 2 - age) % syn + syn) % syn);
    const toNew = Math.round(((syn - age) % syn + syn) % syn);
    return { phase, illum, toFull, toNew };
  }
  async function tryHandleSunMoon(text) {
    const t = norm(text).replace(/[?!.]+$/, '');
    if (t.length > 80) return false;
    const wantSun = /(lever|coucher)s? (du )?soleil|soleil se (leve|couche)|a quelle heure (il fait nuit|la nuit tombe|le jour se leve)/.test(t);
    const wantMoon = /phase de la lune|quelle lune|lune (aujourd'hui|ce soir|actuelle|en ce moment)|pleine lune|nouvelle lune|^la lune$/.test(t);
    if (!wantSun && !wantMoon) return false;
    const parts = [];
    if (wantSun) {

      if (!c) {
        parts.push("Je n'ai pas accès à ta position, donc je ne peux pas te donner le lever et le coucher du soleil.");
      } else {
        const s = sunTimes(new Date(), c.latitude, c.longitude);
        if (s.polar === 'night') parts.push("Aujourd'hui, le soleil ne se lève pas chez toi.");
        else if (s.polar === 'day') parts.push("Aujourd'hui, le soleil ne se couche pas chez toi.");
        else parts.push("Aujourd'hui, le soleil se lève à " + fmtHM(s.rise) + ' et se couche à ' + fmtHM(s.set) + '.');
      }
    }
    if (wantMoon) {
      const mo = moonInfo(new Date());
      parts.push('La Lune est en ' + mo.phase + ', éclairée à environ ' + mo.illum + ' %. Prochaine pleine lune ' + (mo.toFull === 0 ? "aujourd'hui" : 'dans ' + plural(mo.toFull, 'jour', 'jours')) + ', prochaine nouvelle lune ' + (mo.toNew === 0 ? "aujourd'hui" : 'dans ' + plural(mo.toNew, 'jour', 'jours')) + '.');
    }
    return botReply(parts.join(' '));

  function getChrono() {

  }
  function setChrono(v) {

    }
    if (/(remets?|reinitialise|zero).*(chrono|chronometre)/.test(t)) {

      return botReply('Chrono remis à zéro.');
    }
    if (/^(stop|stoppe|arrete|arreter|termine|fin|fini)(\s+(le |mon |ton )?(chrono|chronometre))?$/.test(t)) {
      const explicit = /(chrono|chronometre)/.test(t);
      if (!running) return explicit ? botReply('Aucun chrono en cours.') : false;
      setChrono(null);
      return botReply('Chrono arrêté : ' + fmtDur(Date.now() - running) + '.');
    }
    if (/^(chrono|chronometre)$|(combien de temps|ou en est|temps).*(chrono|chronometre)|^(chrono|chronometre) en cours/.test(t)) {
      if (!running) return botReply('Aucun chrono en cours. Dis « lance le chrono » pour en démarrer un.');
      return botReply('Le chrono tourne depuis ' + fmtDur(Date.now() - running) + '.');
    }
    return false;
  }

  // ----- Calcul d'âge -----
  function tryHandleAge(text) {
    const t = norm(text).replace(/[?!.]+$/, '');
    if (!/\bage\b/.test(t) || !/\b(ne|nee|naissance)\b/.test(t)) return false;
    let d, mo, y;
    let m = t.match(new RegExp('\\b(1er|\\d{1,2})\\s+(' + FR_MONTHS_RE + ')\\s+(\\d{4})\\b'));
    if (m) { d = m[1] === '1er' ? 1 : parseInt(m[1], 10); mo = FR_MONTHS.indexOf(m[2]); y = parseInt(m[3], 10); }
    else {
      m = t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})\b/);
      if (m) { d = parseInt(m[1], 10); mo = parseInt(m[2], 10) - 1; y = parseInt(m[3], 10); }
    }
    if (d === undefined) return botReply("Donne-moi ta date de naissance complète, par exemple : j'ai quel âge, je suis né le 3 mai 1990.");
    const birth = new Date(y, mo, d);
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (birth.getMonth() !== mo || birth.getDate() !== d || birth > today) return botReply("Cette date de naissance ne me semble pas valide.");
    let years = today.getFullYear() - y;
    let months = today.getMonth() - mo;
    let days = today.getDate() - d;
    if (days < 0) { months--; days += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
    if (months < 0) { years--; months += 12; }
    let next = new Date(today.getFullYear(), mo, d);
    if (next < today) next = new Date(today.getFullYear() + 1, mo, d);
    const n = Math.round((next - today) / 86400000);
    if (n === 0) return botReply('Joyeux anniversaire ! Tu as ' + plural(years, 'an', 'ans') + " aujourd'hui.");
    const nextStr = next.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return botReply('Ça fait ' + plural(years, 'an', 'ans') + ', ' + plural(months, 'mois', 'mois') + ' et ' + plural(days, 'jour', 'jours') + '. Prochain anniversaire : ' + nextStr + ', ' + daysText(n) + '.');
  }

  const FX_ALT = FX_ALIASES.map(a => a[0]).join('|');

  async function loadFx() {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem('bipbip_fx') || 'null'); } catch (e) {}
    if (cache && cache.rates && Date.now() - cache.ts < 6 * 3600 * 1000) return { rates: cache.rates, note: '' };
    if (navigator.onLine !== false) {
      try {
        const r = await fetch('https://open.er-api.com/v6/latest/EUR');
        const d = await r.json();
        if (d && d.rates && d.rates.USD) {
          try { localStorage.setItem('bipbip_fx', JSON.stringify({ rates: d.rates, ts: Date.now() })); } catch (e) {}
          return { rates: d.rates, note: '' };
        }
      } catch (e) {}
      try {
        const r = await fetch('https://api.frankfurter.app/latest?from=EUR');
        const d = await r.json();
        if (d && d.rates) {
          const rates = Object.assign({}, FX_FALLBACK, d.rates, { EUR: 1 });
          try { localStorage.setItem('bipbip_fx', JSON.stringify({ rates, ts: Date.now() })); } catch (e) {}
          return { rates, note: '' };
        }
      } catch (e) {}
    }
    if (cache && cache.rates) return { rates: cache.rates, note: ' (dernier taux enregistré, hors ligne)' };
    return { rates: FX_FALLBACK, note: ' (taux approximatifs, hors ligne)' };
  }
  async function tryHandleCurrency(text) {
    const m = norm(text).match(FX_RE);
    if (!m) return false;
    const val = parseFloat(m[1].replace(',', '.'));
    const from = FX_ALIASES.find(a => a[0] === m[2])[1];
    const to = FX_ALIASES.find(a => a[0] === m[3])[1];
    if (from === to) return botReply(fmtN(val) + ' ' + FX_NAMES[from] + ' = ' + fmtN(val) + ' ' + FX_NAMES[to] + '.');
    const { rates, note } = await loadFx();
    if (!rates[from] || !rates[to]) return botReply("Je n'ai pas le taux pour cette devise.");
    const res = val / rates[from] * rates[to];
    return botReply(fmtN(val) + ' ' + FX_NAMES[from] + ' = ' + fmtN(res) + ' ' + FX_NAMES[to] + '.' + note);
  }

  // ----- Liste de courses -----
  function getShop() {
    try { return JSON.parse(localStorage.getItem('bipbip_shopping') || '[]'); } catch (e) { return []; }
  }
  function setShop(l) {
    try { localStorage.setItem('bipbip_shopping', JSON.stringify(l)); } catch (e) {}
  }
  function cleanItem(s) {
    return s.trim().replace(/^(?:du|de la|de l'|des|d'|le|la|les|l'|un|une)\s*/i, '').trim();
  }
  function tryHandleShopping(text) {
    const raw = text.trim().replace(/[?!.]+$/, '');
    const t = norm(raw);
    if (/^(vide|efface|supprime)\s+(toute\s+)?(mes|ma|la)\s+(liste de )?courses$/.test(t)) {
      setShop([]);
      return botReply("C'est fait, ta liste de courses est vide.");
    }
    if (/^((lis|lire|montre|affiche|donne)(-moi)?\s+)?(mes|ma|la)\s+(liste de )?courses$|^qu'est[- ]ce que je dois acheter$/.test(t)) {
      const list = getShop();
      if (!list.length) return botReply("Ta liste de courses est vide.");
      return botReply('Ta liste de courses :\n' + list.map(x => '• ' + x).join('\n'), 'Tu dois acheter : ' + list.join(', ') + '.');
    }
    const add = raw.match(/^(?:ajoute|ajouter|mets?|rajoute)\s+(.+?)\s+(?:aux|à mes|a mes|à ma|a ma|à la|a la|sur ma|sur la|dans mes|dans ma|dans la)\s+(?:liste de\s+)?courses$/i);
    if (add) {
      const items = add[1].split(/\s*(?:,|\bet\b)\s*/i).map(cleanItem).filter(Boolean);
      if (!items.length) return false;
      const list = getShop();
      items.forEach(i => { if (!list.some(x => norm(x) === norm(i))) list.push(i); });
      setShop(list);
      return botReply('Ajouté à tes courses : ' + items.join(', ') + '.');
    }
    const rem = raw.match(/^(raye|rayer|barre|retire|enl[eè]ve|supprime)\s+(.+?)(?:\s+(?:des|de la|de mes|de ma|de|sur la|sur ma)\s+(?:liste de\s+)?courses)?$/i);
    if (rem) {
      const hasCourses = /courses$/i.test(raw);
      const items = rem[2].split(/\s*(?:,|\bet\b)\s*/i).map(cleanItem).filter(Boolean);
      const list = getShop();
      const removed = [];
      items.forEach(i => {
        const idx = list.findIndex(x => norm(x) === norm(i) || norm(x).includes(norm(i)));
        if (idx !== -1) { removed.push(list[idx]); list.splice(idx, 1); }
      });
      if (!removed.length) return hasCourses ? botReply("Je ne trouve pas ça dans ta liste de courses.") : false;
      setShop(list);
      return botReply('Retiré de tes courses : ' + removed.join(', ') + '.');
    }
    return false;
  }

    try {

        fetchWeatherContext(question),
        fetchNewsContext(question),
        fetchCurrencyContext(question),
        fetchWikipediaContext(question)

      if (weatherResult.locationDenied) {
        removeTyping();
        const bubble = addBubble('bot', "Je n'ai pas accès à ta position, donc je ne peux pas te donner la météo. Vérifie que tu as autorisé la localisation pour cette page dans les réglages de ton navigateur.");
        bubble.classList.add('error');
        requestInFlight = false;
        sendBtn.disabled = false;
        return;
      }

      const liveContext = [weatherResult.context, newsCtx, currencyCtx, wikiCtx].filter(Boolean).join(' ');

      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },

  // ---------- Reconnaissance vocale (micro) ----------
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let manualStop = false;
  let finalTranscript = '';
  let startWatchdog = null;

  function micError(message) {
    manualStop = true;
    listening = false;
    micBtn.classList.remove('listening');
    input.placeholder = "Écris ou parle...";
    addBubble('bot', message).classList.add('error');
  }

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      clearTimeout(startWatchdog);
      listening = true;
      micBtn.classList.add('listening');
      input.placeholder = "Je t'écoute... (appuie à nouveau pour envoyer)";
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += chunk + ' ';
        } else {
          interim += chunk;
        }
      }
      input.value = (finalTranscript + interim).trim();
    };

    recognition.onerror = (event) => {
      clearTimeout(startWatchdog);
      // "no-speech" est normal pendant les silences ; on laisse "onend" relancer tout seul.
      if (event.error === 'no-speech' && !manualStop) return;
      const reasons = {
        'not-allowed': "Le micro est bloqué pour cette page. Vérifie l'autorisation micro dans les réglages, ou ouvre ce fichier directement dans Safari plutôt que dans l'aperçu de l'app.",
        'service-not-allowed': "Le service de reconnaissance vocale n'est pas autorisé ici, probablement à cause de l'aperçu intégré. Essaie d'ouvrir le fichier directement dans Safari.",
        'audio-capture': "Je ne trouve pas de micro disponible sur cet appareil.",
        'network': "Le micro nécessite une connexion réseau active pour reconnaître ta voix."
      };
      if (reasons[event.error]) {
        micError(reasons[event.error]);
      }
    };

    recognition.onend = () => {
      clearTimeout(startWatchdog);
      if (!manualStop) {
        // Le moteur du navigateur s'est arrêté tout seul (silence, timeout interne...) :
        // on relance discrètement pour continuer à écouter la même question.
        setTimeout(() => {
          if (!manualStop) {
            try { recognition.start(); } catch (e) { /* déjà en cours, on ignore */ }
          }
        }, 200);
        return;
      }
      listening = false;
      micBtn.classList.remove('listening');
      input.placeholder = "Écris ou parle...";
      const text = input.value.trim();
      finalTranscript = '';
      if (text) {
        form.requestSubmit();
      }
    };

    micBtn.addEventListener('click', () => {
      if (listening) {
        manualStop = true;
        recognition.stop();
        return;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      stopTalking();
      input.value = '';
      finalTranscript = '';
      manualStop = false;
      try {
        recognition.start();
        // Si "onstart" ne se déclenche pas rapidement, le micro est probablement bloqué en silence
        startWatchdog = setTimeout(() => {
          if (!listening) {
            micError("Le micro ne répond pas ici — l'aperçu dans l'app bloque probablement l'accès au micro. Ouvre ce fichier dans Safari pour l'utiliser.");
          }
        }, 2500);
      } catch (err) {
        micError("Impossible de démarrer le micro : " + err.message);
      }
    });
  } else {
    micBtn.addEventListener('click', () => {
      micError("La reconnaissance vocale n'est pas disponible sur ce navigateur. Tu peux quand même écrire ta question.");
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    stopTalking();
    addBubble('user', text);
    history.push({ role: 'user', content: text });
    saveHistory();
    input.value = '';
    input.style.height = 'auto';
    const handled = await tryHandleLocalCommands(text);
    if (!handled) {
      history.pop();
      saveHistory();
      askRobot(text);
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  loadHistory();
</script>
</body>
</html>
