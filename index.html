<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #171B34;
    --panel: #232951;
    --panel-edge: #323a6e;
    --cream: #F3EFE4;
    --amber: #F2A65A;
    --amber-dim: #c9814a;
    --dim: #9098c4;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--cream);
    display:flex;
    justify-content:center;
    overscroll-behavior: none;
  }
  #app{
    width:100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    display:flex;
    flex-direction:column;
    background: radial-gradient(circle at 50% -10%, #262d59 0%, var(--bg) 55%);
  }

  /* ---------- Head stage ---------- */
  #stage{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 8px 20px 4px;
    border-bottom: 1px solid var(--panel-edge);
    position: relative;
  }
  #stage::before{
    content:"";
    position:absolute;
    top: -4px;
    width: 340px;
    height: 340px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(242,166,90,0.18) 0%, rgba(242,166,90,0) 70%);
    pointer-events:none;
  }

  #head-wrap{ width: 260px; height: 260px; max-width: 68vw; max-height: 68vw; position:relative; z-index:1; }
  #head-wrap svg{ width:100%; height:100%; overflow: visible; }

  .antenna-line{ transform-origin: 100px 40px; animation: sway 3.6s ease-in-out infinite; }
  @keyframes sway{
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(3deg); }
  }
  .antenna-tip{ animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  #eye-l, #eye-r{
    transform-origin: center;
    animation: blink 4.5s ease-in-out infinite;
  }
  #eye-r{ animation-delay: 0.06s; }
  @keyframes blink{
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }

  #mouth{ transition: d 0.09s ease; }

  .ear-wave{ opacity: 0; transition: opacity 0.2s ease; }
  #head-wrap.talking .ear-wave{ opacity: 1; animation: wave-pulse 0.9s ease-in-out infinite; }
  .ear-wave.outer{ animation-delay: 0.15s; }
  @keyframes wave-pulse{
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  #head-wrap.talking #eye-l, #head-wrap.talking #eye-r{ animation-duration: 2.6s; }
  #head-wrap.thinking .antenna-line{ animation-duration: 0.7s; }
  #head-wrap.thinking .seam{ animation: seam-scan 1s linear infinite; }
  @keyframes seam-scan{
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  #name-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: 2px;
  }
  #name-row .title{
    font-family: var(--font-display);
    font-size: 19px;
    font-weight:600;
  }
  #status-dot{
    width:8px; height:8px; border-radius:50%;
    background: #6de08a;
    box-shadow: 0 0 0 0 rgba(109,224,138,0.6);
    animation: pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(109,224,138,0.5); }
    70%{ box-shadow: 0 0 0 7px rgba(109,224,138,0); }
    100%{ box-shadow: 0 0 0 0 rgba(109,224,138,0); }
  }
  .subtitle{ font-size: 12.5px; color: var(--dim); margin-top: 3px; }

  #mute{
    position:absolute;
    top: 0; right: 0;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--cream);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #mute svg{ width:16px; height:16px; }
  #mute.off{ color: var(--dim); }

  /* ---------- Thread ---------- */
  #thread{
    flex:1;
    overflow-y:auto;
    padding: 16px 16px 10px;
    display:flex;
    flex-direction:column;
    gap: 12px;
  }
  #thread::-webkit-scrollbar{ width:0; }

  .empty-state{
    margin: auto 8px;
    text-align:center;
    color: var(--dim);
    font-size: 13px;
    line-height:1.5;
    max-width: 280px;
    margin-left:auto; margin-right:auto;
  }

  .bubble-row{ display:flex; align-items:flex-end; gap:6px; }
  .bubble-row.user{ justify-content:flex-end; }
  .bubble-row.bot{ justify-content:flex-start; }

  .listen-btn{
    flex-shrink:0;
    width: 30px; height: 30px;
    border-radius:50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    font-size: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .listen-btn:active{ transform: scale(0.9); }

  .bubble{
    max-width: 76%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user{
    background: var(--amber);
    color: #241708;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot{
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    border-bottom-left-radius: 4px;
  }
  .bubble.error{
    background: #3a2130;
    border: 1px solid #6e3250;
    color: #f0c4d8;
  }

  .typing{ display:flex; gap:4px; padding: 14px 16px; align-items:center; }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background: var(--dim);
    animation: bounce 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay: 0.15s; }
  .typing span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 60%, 100% { transform: translateY(0); opacity:0.5; }
    30% { transform: translateY(-4px); opacity:1; }
  }

  form#composer{
    flex-shrink:0;
    display:flex;
    gap: 8px;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--panel-edge);
    background: var(--bg);
  }
  #input{
    flex:1;
    resize:none;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    color: var(--cream);
    font-family: var(--font-body);
    font-size: 16px;
    border-radius: 20px;
    padding: 11px 16px;
    outline:none;
    max-height: 110px;
    line-height:1.4;
  }
  #input:focus{ border-color: var(--amber-dim); }
  #input::placeholder{ color: var(--dim); }

  #send{
    flex-shrink:0;
    width: 44px; height:44px;
    border-radius:50%;
    border:none;
    background: var(--amber);
    color:#241708;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  #send:active{ transform: scale(0.92); }
  #send:disabled{ opacity:0.4; cursor:default; }
  #send svg{ width:19px; height:19px; }

  #mic{
    flex-shrink:0;
    width: 44px; height:44px;
    border-radius:50%;
    border: 1px solid var(--panel-edge);
    background: var(--panel);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  #mic:active{ transform: scale(0.92); }
  #mic svg{ width:18px; height:18px; }
  #mic.listening{
    background: #d84c4c;
    border-color: #d84c4c;
    color: var(--cream);
    animation: mic-pulse 1.3s ease-in-out infinite;
  }
  @keyframes mic-pulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(216,76,76,0.5); }
    50% { box-shadow: 0 0 0 9px rgba(216,76,76,0); }
  }
  #mic:disabled{ opacity:0.4; cursor:default; }
</style>
</head>
<body>

<div id="app">
  <div id="stage" style="position:relative;">
    <button id="mute" aria-label="Couper la voix">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="4 9 8 9 12 5 12 19 8 15 4 15 4 9" fill="currentColor" stroke="none"/>
        <path id="wave1" d="M15.5 9a5 5 0 0 1 0 6"/>
        <path id="wave2" d="M18 6.5a9 9 0 0 1 0 11"/>
      </svg>
    </button>

    <div id="head-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="domeFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2b3268"/>
            <stop offset="100%" stop-color="#1e2450"/>
          </linearGradient>
          <linearGradient id="visorFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#171b3c"/>
            <stop offset="100%" stop-color="#12152f"/>
          </linearGradient>
        </defs>

        <!-- antenna -->
        <line class="antenna-line" x1="100" y1="40" x2="100" y2="16" stroke="#F2A65A" stroke-width="4" stroke-linecap="round"/>
        <circle class="antenna-tip" cx="100" cy="11" r="7" fill="#F2A65A"/>

        <!-- ears with sound waves -->
        <circle cx="26" cy="112" r="15" fill="#232951" stroke="#3a4184" stroke-width="2.5"/>
        <path class="ear-wave inner" d="M 12 106 Q 5 112 12 118" stroke="#F2A65A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path class="ear-wave outer" d="M 6 100 Q -6 112 6 124" stroke="#F2A65A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

        <circle cx="174" cy="112" r="15" fill="#232951" stroke="#3a4184" stroke-width="2.5"/>
        <path class="ear-wave inner" d="M 188 106 Q 195 112 188 118" stroke="#F2A65A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path class="ear-wave outer" d="M 194 100 Q 206 112 194 124" stroke="#F2A65A" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

        <!-- head dome -->
        <rect x="34" y="42" width="132" height="126" rx="46" fill="url(#domeFill)" stroke="#F2A65A" stroke-width="3.5"/>

        <!-- seam / panel line -->
        <path class="seam" d="M 34 96 H 166" stroke="#3a4184" stroke-width="1.5" opacity="0.6"/>
        <circle class="seam" cx="46" cy="96" r="2" fill="#F2A65A" opacity="0.6"/>
        <circle class="seam" cx="154" cy="96" r="2" fill="#F2A65A" opacity="0.6"/>

        <!-- visor / face plate -->
        <rect x="50" y="66" width="100" height="58" rx="26" fill="url(#visorFill)"/>

        <!-- eyes -->
        <rect id="eye-l" x="68" y="86" width="18" height="24" rx="9" fill="#F2A65A"/>
        <rect id="eye-r" x="114" y="86" width="18" height="24" rx="9" fill="#F2A65A"/>

        <!-- mouth -->
        <path id="mouth" d="M 74 150 Q 100 150 126 150" stroke="#F3EFE4" stroke-width="5" stroke-linecap="round" fill="none"/>

        <!-- cheek bolts -->
        <circle cx="48" cy="140" r="3.5" fill="#3a4184"/>
        <circle cx="152" cy="140" r="3.5" fill="#3a4184"/>
      </svg>
    </div>

    <div id="name-row">
      <span class="title">Bipbip</span>
      <div id="status-dot"></div>
    </div>
    <div class="subtitle">Pose-moi n'importe quelle question, à voix... écrite</div>
  </div>

  <div id="thread">
    <div class="empty-state" id="empty-state">
      Histoire, science, cuisine, code, conseils... écris ta question en bas, et je te réponds à voix haute.
    </div>
  </div>

  <form id="composer">
    <textarea id="input" placeholder="Écris ou parle..." rows="1"></textarea>
    <button type="button" id="mic" aria-label="Poser une question au micro">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </button>
    <button type="submit" id="send" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </form>
</div>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const micBtn = document.getElementById('mic');
  const headWrap = document.getElementById('head-wrap');
  const mouth = document.getElementById('mouth');
  const muteBtn = document.getElementById('mute');
  const wave1 = document.getElementById('wave1');
  const wave2 = document.getElementById('wave2');

  let history = [];
  let muted = false;
  let mouthTimer = null;

  const MOUTH_CLOSED = "M 74 150 Q 100 150 126 150";
  const MOUTH_SHAPES = [
    "M 74 145 Q 100 174 126 145",
    "M 78 150 Q 100 161 122 150",
    "M 74 150 Q 100 144 126 150",
    "M 82 150 Q 100 163 118 150"
  ];

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.classList.toggle('off', muted);
    wave1.style.display = muted ? 'none' : '';
    wave2.style.display = muted ? 'none' : '';
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });

  function addBubble(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (role === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
    bubble.textContent = text;
    row.appendChild(bubble);

    if (role !== 'user') {
      const listenBtn = document.createElement('button');
      listenBtn.type = 'button';
      listenBtn.className = 'listen-btn';
      listenBtn.setAttribute('aria-label', 'Écouter cette réponse');
      listenBtn.innerHTML = '🔊';
      listenBtn.addEventListener('click', () => speak(text));
      row.appendChild(listenBtn);
    }

    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'bubble-row bot';
    row.id = 'typing-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    headWrap.classList.add('thinking');
  }

  function removeTyping() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
    headWrap.classList.remove('thinking');
  }

  function startTalking() {
    headWrap.classList.add('talking');
    let i = 0;
    mouthTimer = setInterval(() => {
      mouth.setAttribute('d', MOUTH_SHAPES[i % MOUTH_SHAPES.length]);
      i++;
    }, 130);
  }

  function stopTalking() {
    headWrap.classList.remove('talking');
    clearInterval(mouthTimer);
    mouth.setAttribute('d', MOUTH_CLOSED);
  }

  function getVoicesAsync() {
    return new Promise((resolve) => {
      const existing = window.speechSynthesis.getVoices();
      if (existing.length) { resolve(existing); return; }
      window.speechSynthesis.onvoiceschanged = () => {
        resolve(window.speechSynthesis.getVoices());
      };
      // Filet de sécurité si l'événement ne se déclenche jamais
      setTimeout(() => resolve(window.speechSynthesis.getVoices()), 500);
    });
  }

  function pickBestFrenchVoice(voices) {
    const frVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if (!frVoices.length) return null;
    // On préfère les voix "haute qualité" connues (Google, Natural, Enhanced, Premium)
    // avant les voix système basiques.
    const qualityHints = ['google', 'natural', 'enhanced', 'premium', 'neural'];
    const scored = frVoices.map(v => {
      const name = v.name.toLowerCase();
      const score = qualityHints.reduce((acc, hint) => acc + (name.includes(hint) ? 10 : 0), 0)
        + (v.localService ? 1 : 0);
      return { v, score };
    });
    scored.sort((a, b) => b.score - a.score);
    return scored[0].v;
  }

  let cachedFrVoice = null;
  getVoicesAsync().then(voices => { cachedFrVoice = pickBestFrenchVoice(voices); });

  function speak(text) {
    if (muted || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR';
    utter.rate = 0.97;
    utter.pitch = 1.02;
    if (cachedFrVoice) utter.voice = cachedFrVoice;
    utter.onstart = startTalking;
    utter.onend = stopTalking;
    utter.onerror = stopTalking;
    window.speechSynthesis.speak(utter);
  }

  // Sur mobile (Safari/Chrome), la synthèse vocale doit être "débloquée"
  // par un vrai clic direct avant de pouvoir être déclenchée plus tard
  // après un appel réseau (sinon elle reste muette silencieusement).
  let voiceUnlocked = false;
  function unlockVoice() {
    if (voiceUnlocked || !window.speechSynthesis) return;
    voiceUnlocked = true;
    const primer = new SpeechSynthesisUtterance('');
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
    // Force le chargement de la liste des voix sur certains navigateurs
    window.speechSynthesis.getVoices();
  }
  document.body.addEventListener('click', unlockVoice, { once: true });
  document.body.addEventListener('touchstart', unlockVoice, { once: true });

  // Remplace cette URL par celle de ton Worker une fois créé,
  // par exemple : "https://ton-worker.tonpseudo.workers.dev"
  const WORKER_URL = "https://bipbip-relay.14vd298.workers.dev";

  // ---------- Météo réelle (Open-Meteo, gratuit, sans clé) ----------
  let weatherContext = '';
  let weatherRequested = false;

  function weatherCodeToText(code) {
    const map = {
      0: "ciel dégagé", 1: "plutôt dégagé", 2: "partiellement nuageux", 3: "couvert",
      45: "brouillard", 48: "brouillard givrant",
      51: "bruine légère", 53: "bruine", 55: "bruine forte",
      61: "pluie légère", 63: "pluie", 65: "forte pluie",
      71: "neige légère", 73: "neige", 75: "forte neige",
      80: "averses légères", 81: "averses", 82: "averses violentes",
      95: "orage", 96: "orage avec grêle", 99: "orage violent avec grêle",
    };
    return map[code] || "conditions variables";
  }

  function loadWeather() {
    if (weatherRequested || !navigator.geolocation) return;
    weatherRequested = true;
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        try {
          const { latitude, longitude } = pos.coords;
          const res = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`
          );
          const data = await res.json();
          const temp = Math.round(data.current.temperature_2m);
          const desc = weatherCodeToText(data.current.weather_code);
          const wind = Math.round(data.current.wind_speed_10m);
          weatherContext = `Météo actuelle chez l'utilisateur : ${desc}, ${temp}°C, vent à ${wind} km/h.`;
        } catch (e) { /* pas grave, Bipbip répondra sans météo */ }
      },
      () => { /* géolocalisation refusée, on ignore simplement */ },
      { timeout: 6000 }
    );
  }
  loadWeather();

  // ---------- Actualités (France Info, via rss2json, gratuit sans clé) ----------
  async function fetchNewsContext(question) {
    const lower = question.toLowerCase();
    const triggers = ['actualité', 'actualités', 'actu ', 'les infos', 'infos du jour', 'nouvelles du jour', "qu'est-ce qui se passe"];
    if (!triggers.some(t => lower.includes(t))) return '';
    try {
      const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://www.francetvinfo.fr/titres.rss'));
      const data = await res.json();
      const titles = (data.items || []).slice(0, 5).map(i => i.title);
      if (!titles.length) return '';
      return "Voici les titres d'actualité les plus récents en France : " + titles.join(' | ') + '.';
    } catch (e) { return ''; }
  }

  // ---------- Taux de change (Frankfurter, gratuit sans clé) ----------
  const CURRENCY_WORDS = {
    'euro': 'EUR', 'euros': 'EUR',
    'dollar canadien': 'CAD', 'dollars canadiens': 'CAD',
    'dollar': 'USD', 'dollars': 'USD',
    'livre sterling': 'GBP', 'livres sterling': 'GBP', 'livre': 'GBP', 'livres': 'GBP',
    'franc suisse': 'CHF', 'francs suisses': 'CHF',
    'yen': 'JPY', 'yens': 'JPY',
  };
  async function fetchCurrencyContext(question) {
    const lower = question.toLowerCase();
    const isConversion = /taux de change|combien (vaut|font|coûte)|conversion|convertir/.test(lower);
    if (!isConversion) return '';
    const found = new Set();
    for (const word in CURRENCY_WORDS) {
      if (lower.includes(word)) found.add(CURRENCY_WORDS[word]);
    }
    if (found.size === 0) return '';
    const codes = Array.from(found);
    const base = codes[0];
    const targets = codes.slice(1).length ? codes.slice(1) : ['EUR', 'USD', 'GBP', 'CHF'].filter(c => c !== base);
    try {
      const res = await fetch(`https://api.frankfurter.app/latest?from=${base}&to=${targets.join(',')}`);
      const data = await res.json();
      const rates = Object.entries(data.rates).map(([c, r]) => `1 ${base} = ${r} ${c}`).join(', ');
      return "Taux de change actuels : " + rates + ".";
    } catch (e) { return ''; }
  }

  // ---------- Wikipédia (API officielle, gratuite sans clé) ----------
  async function fetchWikipediaContext(question) {
    const lower = question.toLowerCase();
    const triggers = ['qui est ', "qu'est-ce que ", 'qu\'est ce que ', "c'est quoi ", 'parle-moi de ', 'parle moi de ', "explique-moi ce qu'est "];
    const trigger = triggers.find(t => lower.includes(t));
    if (!trigger) return '';
    const subject = question.slice(lower.indexOf(trigger) + trigger.length).replace(/[?.!]/g, '').trim();
    if (!subject) return '';
    try {
      const searchRes = await fetch(`https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(subject)}&format=json&origin=*`);
      const searchData = await searchRes.json();
      const title = searchData.query && searchData.query.search && searchData.query.search[0] && searchData.query.search[0].title;
      if (!title) return '';
      const sumRes = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
      const sumData = await sumRes.json();
      if (!sumData.extract) return '';
      return `Extrait de Wikipédia sur "${title}" : ${sumData.extract}`;
    } catch (e) { return ''; }
  }

  let requestInFlight = false;

  async function askRobot(question) {
    if (requestInFlight) return;
    requestInFlight = true;
    history.push({ role: 'user', content: question });
    addTyping();
    sendBtn.disabled = true;

    try {
      const [newsCtx, currencyCtx, wikiCtx] = await Promise.all([
        fetchNewsContext(question),
        fetchCurrencyContext(question),
        fetchWikipediaContext(question)
      ]);
      const liveContext = [weatherContext, newsCtx, currencyCtx, wikiCtx].filter(Boolean).join(' ');

      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          system: "Tu es Bipbip, un petit robot assistant amical. Nous sommes le " + new Date().toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + (liveContext ? " " + liveContext : "") + " Tu réponds en français, de façon claire, chaleureuse et concise (adaptée à être lue à voix haute et affichée sur un écran de téléphone). Tu peux parler de n'importe quel sujet. Évite les listes à puces et le markdown, préfère des phrases courtes.",
          messages: history
        })
      });

      if (!response.ok) throw new Error('Réponse réseau incorrecte');

      const data = await response.json();
      const text = data.content
        .map(block => block.type === 'text' ? block.text : '')
        .filter(Boolean)
        .join('\n')
        .trim() || "Hmm, je n'ai pas de réponse à te donner là.";

      removeTyping();
      addBubble('bot', text);
      history.push({ role: 'assistant', content: text });
      speak(text);
    } catch (err) {
      removeTyping();
      const bubble = addBubble('bot', "Je n'ai pas réussi à me connecter. Réessaie dans un instant.");
      bubble.classList.add('error');
      history.pop();
    } finally {
      sendBtn.disabled = false;
      requestInFlight = false;
    }
  }

  // ---------- Reconnaissance vocale (micro) ----------
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let manualStop = false;
  let finalTranscript = '';
  let startWatchdog = null;

  function micError(message) {
    manualStop = true;
    listening = false;
    micBtn.classList.remove('listening');
    input.placeholder = "Écris ou parle...";
    addBubble('bot', message).classList.add('error');
  }

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      clearTimeout(startWatchdog);
      listening = true;
      micBtn.classList.add('listening');
      input.placeholder = "Je t'écoute... (appuie à nouveau pour envoyer)";
    };

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += chunk + ' ';
        } else {
          interim += chunk;
        }
      }
      input.value = (finalTranscript + interim).trim();
    };

    recognition.onerror = (event) => {
      clearTimeout(startWatchdog);
      // "no-speech" est normal pendant les silences ; on laisse "onend" relancer tout seul.
      if (event.error === 'no-speech' && !manualStop) return;
      const reasons = {
        'not-allowed': "Le micro est bloqué pour cette page. Vérifie l'autorisation micro dans les réglages, ou ouvre ce fichier directement dans Safari plutôt que dans l'aperçu de l'app.",
        'service-not-allowed': "Le service de reconnaissance vocale n'est pas autorisé ici, probablement à cause de l'aperçu intégré. Essaie d'ouvrir le fichier directement dans Safari.",
        'audio-capture': "Je ne trouve pas de micro disponible sur cet appareil.",
        'network': "Le micro nécessite une connexion réseau active pour reconnaître ta voix."
      };
      if (reasons[event.error]) {
        micError(reasons[event.error]);
      }
    };

    recognition.onend = () => {
      clearTimeout(startWatchdog);
      if (!manualStop) {
        // Le moteur du navigateur s'est arrêté tout seul (silence, timeout interne...) :
        // on relance discrètement pour continuer à écouter la même question.
        setTimeout(() => {
          if (!manualStop) {
            try { recognition.start(); } catch (e) { /* déjà en cours, on ignore */ }
          }
        }, 200);
        return;
      }
      listening = false;
      micBtn.classList.remove('listening');
      input.placeholder = "Écris ou parle...";
      const text = input.value.trim();
      finalTranscript = '';
      if (text) {
        form.requestSubmit();
      }
    };

    micBtn.addEventListener('click', () => {
      if (listening) {
        manualStop = true;
        recognition.stop();
        return;
      }
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      stopTalking();
      input.value = '';
      finalTranscript = '';
      manualStop = false;
      try {
        recognition.start();
        // Si "onstart" ne se déclenche pas rapidement, le micro est probablement bloqué en silence
        startWatchdog = setTimeout(() => {
          if (!listening) {
            micError("Le micro ne répond pas ici — l'aperçu dans l'app bloque probablement l'accès au micro. Ouvre ce fichier dans Safari pour l'utiliser.");
          }
        }, 2500);
      } catch (err) {
        micError("Impossible de démarrer le micro : " + err.message);
      }
    });
  } else {
    micBtn.addEventListener('click', () => {
      micError("La reconnaissance vocale n'est pas disponible sur ce navigateur. Tu peux quand même écrire ta question.");
    });
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    stopTalking();
    addBubble('user', text);
    input.value = '';
    input.style.height = 'auto';
    askRobot(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
